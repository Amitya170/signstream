name: SignStream CI & Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npm run build

      - name: Run Vitest & axe-core Accessibility Checks
        run: npm run test

      - name: Verify Licences and Documentation Integrity
        run: |
          test -f README.md
          test -f LICENSES.md
          test -f docs/ETHICS.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DATA_SOURCES.md
          test -f docs/CONTRIBUTING.md
